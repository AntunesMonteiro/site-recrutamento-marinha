<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Concursos — Marinha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos/concursos.css" />
</head>
<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <a href="index.html" class="brand" aria-label="Ir para a homepage">
      <img src="imagens/marinhaHorizontalWhite.png" alt="Marinha" class="logo">
    </a>
    <nav aria-label="Principal">
      <ul>
        <li><a href="profissoes.html">Profissões</a></li>
        <li><a class="active" href="concursos.html" aria-current="page">Concursos</a></li>
        <li><a href="prepara.html">Prepara-te</a></li>
        <li><a href="carreira.html">A tua carreira</a></li>
        <li><a href="candidata.html">Candidata-te</a></li>
      </ul>
    </nav>
    <button class="hamburguer-btn" aria-label="Abrir menu">Menu</button>
  </header>

  <!-- CENTRADO NA PÁGINA -->
  <main class="vp-center">
    <div class="segmented" role="tablist" aria-label="Estado dos concursos">
      <!-- ABERTOS -->
      <a class="seg-item" href="concursos-abertos.html" role="tab"> 
        <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="label">ABERTOS</span>
      </a>

      <!-- A DECORRER -->
      <a class="seg-item" href="#a-decorrer" role="tab" aria-selected="true">
        <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="label">A DECORRER</span>
      </a>

      <!-- TERMINADOS RECENTEMENTE -->
      <a class="seg-item" href="#terminados" role="tab" aria-selected="false">
        <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="label">TERMINADOS<br/>RECENTEMENTE</span>
      </a>

      <!-- FUTUROS -->
      <a class="seg-item" href="#futuros" role="tab" aria-selected="false">
        <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l9 16H3L12 3z" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 10v4m0 3h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="label">FUTUROS</span>
      </a>
    </div>
  </main>

  <!-- MENU MOBILE -->
  <nav class="menu-mobile" hidden aria-label="Menu móvel">
    <a href="profissoes.html">Profissões</a>
    <a class="active" href="concursos.html" aria-current="page">Concursos</a>
    <a href="prepara.html">Prepara-te</a>
    <a href="carreira.html">A tua carreira</a>
    <a href="candidata.html">Candidata-te</a>
  </nav>

  <script>
    // Toggle menu mobile
    const btn = document.querySelector('.hamburguer-btn');
    const menu = document.querySelector('.menu-mobile');
    btn?.addEventListener('click', () => {
      const open = menu.hasAttribute('hidden');
      if (open) menu.removeAttribute('hidden'); else menu.setAttribute('hidden','');
    });
  </script>
</body>
</html>
